[build]
  publish = "public"
  command = "echo 'Deploying static frontend from public/'"

[build.environment]
  NPM_FLAGS = "--ignore-scripts"

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/attack-sandbox"
  to = "/attack-sandbox.html"
  status = 200
